name: Release binaries
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin-amd64
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake clang
      - name: Select Rust toolchain and target
        run: |
          rustup show
          rustup target add '${{ matrix.target }}'
      - name: Build UI and registry
        run: make web-install web-build registry-build
      - name: Build binary
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        # Use the existing memory-bounded optimized profile on small hosted runners.
        run: cargo build --locked --profile container -p tallyd --features embedded-ui --target '${{ matrix.target }}'
      - name: Package and smoke test
        env:
          TALLY_RELEASE_BINARY: target/${{ matrix.target }}/container/tallyd
        run: |
          "$TALLY_RELEASE_BINARY" --version
          "$TALLY_RELEASE_BINARY" collector check
          bash scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tally-${{ matrix.platform }}
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tally-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
