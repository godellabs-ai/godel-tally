name: Test native installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Quickly qualify installer-only changes with a known released executable.
      # release.yml separately tests the newly compiled executable before publication.
      - name: Package current installer with the v0.1.0 executable
        run: |
          stage="$(mktemp -d "$RUNNER_TEMP/tally-installer-binary.XXXXXX")"
          base=https://github.com/godellabs-ai/godel-tally/releases/download/v0.1.0
          curl -fLsS --retry 3 "$base/tallyd-darwin-arm64.tar.gz" -o "$stage/tallyd-darwin-arm64.tar.gz"
          curl -fLsS --retry 3 "$base/SHA256SUMS" -o "$stage/SHA256SUMS"
          (cd "$stage" && awk '$2 == "tallyd-darwin-arm64.tar.gz"' SHA256SUMS | shasum -a 256 --check -)
          tar -xzf "$stage/tallyd-darwin-arm64.tar.gz" -C "$stage"
          TALLY_RELEASE_BINARY="$stage/tallyd" bash scripts/package-release.sh
      - name: Install, start, and uninstall using Homebrew and LaunchAgents
        run: bash scripts/test-native-install.sh
