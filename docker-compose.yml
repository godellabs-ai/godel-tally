name: godel-tally

# Container deployment: download this file, create .env beside it, then run
# docker compose up -d --wait. Every setting comes from .env:
# https://godel-labs.ai/docs/tally/installation#docker-compose
# A source checkout builds the image instead with make docker-up (docker-compose.build.yml).
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: ${TALLY_POSTGRES_PASSWORD:?Set TALLY_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tally
    volumes:
      - tally-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U tally -d tally"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse:26.9
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: tally
      CLICKHOUSE_USER: tally
      CLICKHOUSE_PASSWORD: ${TALLY_CLICKHOUSE_PASSWORD:?Set TALLY_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - tally-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = clickhouse-serv && clickhouse-client --user tally --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 60

  tallyd:
    image: ${TALLY_IMAGE_PREFIX:-quay.io/godellabs-ai}/godel-tally:${TALLY_IMAGE_TAG:-0.1.4}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    environment:
      TALLY_CLICKHOUSE_URL: http://clickhouse:8123?user=tally
      TALLY_CLICKHOUSE_PASSWORD: ${TALLY_CLICKHOUSE_PASSWORD:?Set TALLY_CLICKHOUSE_PASSWORD in .env}
      TALLY_CLICKHOUSE_DATABASE: tally
      TALLY_AI_LOG_RETENTION_DAYS: ${TALLY_AI_LOG_RETENTION_DAYS:-90}
      TALLY_HTTP_BIND: 0.0.0.0:2357
      # Docker Desktop may inject proxy settings. Database traffic stays on the Compose network.
      NO_PROXY: localhost,127.0.0.1,::1,postgres,clickhouse,${NO_PROXY:-}
      no_proxy: localhost,127.0.0.1,::1,postgres,clickhouse,${no_proxy:-${NO_PROXY:-}}
      # Generated passwords are hexadecimal. URL-encode manually supplied PostgreSQL passwords.
      TALLY_POSTGRES_URL: ${TALLY_POSTGRES_URL:-postgres://tally:${TALLY_POSTGRES_PASSWORD}@postgres:5432/tally}
      TALLY_LOG: ${TALLY_LOG:-info,tower_http=info}
      TALLY_LOG_FORMAT: json
      TALLY_SECRET_KEY: ${TALLY_SECRET_KEY:?Set TALLY_SECRET_KEY in .env}
      TALLY_URL: ${TALLY_URL:-https://localhost:2357}
      TALLY_MAINTENANCE_DIR: /data/maintenance
      TALLY_UPGRADE_CONTAINER_EXECUTION: "1"
      TALLY_RUNTIME_MODE: combined-compose
      TALLY_DEPLOYMENT_ROOT: ${TALLY_DEPLOYMENT_ROOT:-/var/lib/godel-tally/deploy}
      DOCKER_HOST: unix:///var/run/docker.sock
      TALLY_UPGRADE_GATE_PATH: ${TALLY_DEPLOYMENT_ROOT:-/var/lib/godel-tally/deploy}/godel-gate
      TALLY_UPGRADE_STATE_DIR: /data/upgrade
      TALLY_UPGRADE_WEB_ORIGIN: ${TALLY_URL:-https://localhost:2357}
    volumes:
      - tally-data:/data
      - ${TALLY_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - ${TALLY_DEPLOYMENT_ROOT:-/var/lib/godel-tally/deploy}:${TALLY_DEPLOYMENT_ROOT:-/var/lib/godel-tally/deploy}
      # Put tally.crt and tally.key here for your own certificate; leave it empty for a self-signed one.
      - ${TALLY_TLS_DIR:-./tls}:/tls:ro
    ports:
      - "${TALLY_PUBLISH_BIND:-127.0.0.1:2357}:2357"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/tallyd", "healthcheck"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 60

volumes:
  tally-postgres:
  tally-clickhouse:
  tally-data:
