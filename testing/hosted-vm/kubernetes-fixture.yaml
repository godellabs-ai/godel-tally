apiVersion: v1
kind: Namespace
metadata:
  name: tally-shadow-ai-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-inference
  namespace: tally-shadow-ai-test
spec:
  # Discovery needs the workload definition and image; keeping this at zero avoids a
  # second multi-gigabyte image pull inside the nested development cluster.
  replicas: 0
  selector:
    matchLabels:
      app: ollama-inference
  template:
    metadata:
      labels:
        app: ollama-inference
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-inference
  namespace: tally-shadow-ai-test
spec:
  selector:
    app: ollama-inference
  ports:
    - name: http
      port: 11434
      targetPort: 11434
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tally-discovery
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tally-discovery
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tally-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tally-discovery
subjects:
  - kind: ServiceAccount
    name: tally-discovery
    namespace: kube-system
