schema_version: "1"
version: 2026.08.5
fingerprints:
  - id: fingerprint.mcp.server_discover_20260728
    ports: [3000, 4000, 8000, 8080]
    method: post
    request: mcp_server_discover20260728
    path: /mcp
    accepted_content_types: [application/json, text/event-stream]
    max_response_bytes: 16384
    timeout_millis: 1500
    assertions:
      - type: json_string_equals
        field: jsonrpc
        value: "2.0"
      - type: json_array_present
        field: result.supportedVersions
        count_fact: protocol_version_count
    verified_at: 2026-08-13
    evidence:
      - source_type: standards_body
        url: https://modelcontextprotocol.io/specification/2026-07-28/basic/transports/streamable-http
        verified_at: 2026-08-13
        reviewer: godel-tally-maintainers

  - id: fingerprint.ollama.version_v1
    ports: [11434]
    method: get
    path: /api/version
    accepted_content_types: [application/json]
    max_response_bytes: 4096
    timeout_millis: 1500
    assertions:
      - type: json_string_present
        field: version
        fact: version
    verified_at: 2026-08-13
    evidence:
      - source_type: vendor_documentation
        url: https://docs.ollama.com/api/version
        verified_at: 2026-08-13
        reviewer: godel-tally-maintainers

  - id: fingerprint.litellm.health_readiness_v1
    ports: [4000]
    method: get
    path: /health/readiness
    accepted_content_types: [application/json]
    max_response_bytes: 4096
    timeout_millis: 1500
    # Only `status` is asserted. LiteLLM reports `db: "Not connected"` when no database is
    # configured, and that value cannot pass the safe-fact filter, so asserting `db` would make
    # every database-less LiteLLM proxy undetectable — the most common shadow deployment.
    assertions:
      - type: json_string_present
        field: status
        fact: readiness_status
    verified_at: 2026-08-18
    evidence:
      - source_type: vendor_documentation
        url: https://docs.litellm.ai/docs/proxy/health
        verified_at: 2026-08-18
        reviewer: godel-tally-maintainers

  - id: fingerprint.openai_compatible.models_v1
    ports: [4000, 8000, 8080]
    method: get
    path: /v1/models
    accepted_content_types: [application/json]
    max_response_bytes: 65536
    timeout_millis: 1500
    assertions:
      - type: json_string_equals
        field: object
        value: list
      - type: json_array_present
        field: data
        count_fact: model_count
    verified_at: 2026-08-18
    evidence:
      - source_type: vendor_documentation
        url: https://platform.openai.com/docs/api-reference/models
        verified_at: 2026-08-18
        reviewer: godel-tally-maintainers

  - id: fingerprint.vllm.version_v1
    ports: [8000]
    method: get
    path: /version
    accepted_content_types: [application/json]
    max_response_bytes: 4096
    timeout_millis: 1500
    assertions:
      - type: json_string_present
        field: version
        fact: version
    verified_at: 2026-08-18
    evidence:
      - source_type: vendor_documentation
        url: https://docs.vllm.ai/en/stable/serving/online_serving/
        verified_at: 2026-08-18
        reviewer: godel-tally-maintainers

  - id: fingerprint.triton.server_metadata_v2
    ports: [8000]
    method: get
    path: /v2
    accepted_content_types: [application/json]
    max_response_bytes: 16384
    timeout_millis: 1500
    assertions:
      - type: json_string_equals
        field: name
        value: triton
      - type: json_string_present
        field: version
        fact: version
      - type: json_array_present
        field: extensions
        count_fact: extension_count
    verified_at: 2026-08-13
    evidence:
      - source_type: vendor_documentation
        url: https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/customization_guide/inference_protocols.html
        verified_at: 2026-08-13
        reviewer: godel-tally-maintainers
