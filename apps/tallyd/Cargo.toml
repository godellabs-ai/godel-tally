[package]
name = "tallyd"
default-run = "tallyd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
embedded-ui = []

[dependencies]
tally-upgrade = { path = "../tally-upgrade" }
tally-collector = { path = "../tally-collector" }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = { workspace = true, features = ["util"] }
tower-http.workspace = true
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
webpki = { package = "rustls-webpki", version = "0.103" }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
time = "0.3"
tokio-rustls = "0.26"
x509-cert = "0.2"

anyhow.workspace = true
argon2.workspace = true
tally-api = { workspace = true, features = ["embedded-registry"] }
tally-config.workspace = true
tally-observation-buffer.workspace = true
tally-registry-lib.workspace = true
tally-store-postgres.workspace = true
aws-config.workspace = true
aws-sdk-sesv2.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
chrono.workspace = true
getrandom.workspace = true
hex.workspace = true
lettre.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
subtle.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[lints]
workspace = true
