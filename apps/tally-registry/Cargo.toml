[package]
name = "tally-registry-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "tally-registry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
# The registry CLI generates the artifact embedded by tally-api. Disable that
# embedding here so a clean checkout can compile the generator before the
# artifact exists; the OpenAPI/schema surface remains available.
tally-api = { workspace = true, default-features = false }
tally-core.workspace = true
tally-registry-lib.workspace = true
chrono.workspace = true
clap.workspace = true
hex.workspace = true
schemars.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
sigstore-verify.workspace = true
uuid.workspace = true
url.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
